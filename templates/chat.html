<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Medical Chatbot</title>

    <!-- Bootstrap -->

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
    >

    <!-- jQuery -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        type="text/css"
        href="../static/style.css"
    />

</head>

<body>

    <!-- ========================= -->
    <!-- AUTH SCREEN -->
    <!-- ========================= -->

    <div id="authContainer" class="auth-container">

        <div class="auth-box">

            <h3 id="authTitle" class="auth-title">
                Login
            </h3>

            <input
                type="text"
                id="username"
                class="form-control auth-input"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                class="form-control auth-input"
                placeholder="Password"
            >

            <button
                id="authBtn"
                class="auth-btn"
            >
                Login
            </button>

            <div
                id="toggleAuth"
                class="toggle-auth"
            >
                Don't have an account? Signup
            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- CHAT SCREEN -->
    <!-- ========================= -->

    <div
        id="chatContainer"
        class="container-fluid h-100"
        style="display: none;"
    >

        <div class="row justify-content-center h-100">

            <div class="col-md-8 col-xl-6 chat">

                <div class="card">

                    <!-- HEADER -->

                    <div class="card-header msg_head">

                        <div class="d-flex align-items-center w-100">

                            <div class="img_cont">

                                <img
                                    src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                    class="user_img"
                                >

                                <span class="online_icon"></span>

                            </div>

                            <div class="user_info">

                                <span>Medical Chatbot</span>

                                <p>Ask me anything!</p>

                            </div>

                            <!-- LOGOUT -->

                            <div
                                id="logoutBtn"
                                class="logout-btn"
                            >
                                <i class="fas fa-sign-out-alt"></i>
                            </div>

                        </div>

                    </div>

                    <!-- CHAT BODY -->

                    <div
                        id="messageFormeight"
                        class="card-body msg_card_body"
                    ></div>

                    <!-- FOOTER -->

                    <div class="card-footer">

                        <form
                            id="messageArea"
                            class="input-group"
                        >

                            <input
                                type="text"
                                id="text"
                                name="msg"
                                placeholder="Type your message..."
                                autocomplete="off"
                                class="form-control type_msg"
                                required
                            />

                            <div class="input-group-append">

                                <button
                                    type="submit"
                                    id="send"
                                    class="input-group-text send_btn"
                                >
                                    <i class="fas fa-location-arrow"></i>
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

<script>

    // ====================================
    // BASE URL
    // ====================================

    const BASE_URL =
        window.location.hostname === "localhost"
        ? "http://127.0.0.1:8000"
        : "https://medrag-hbal.onrender.com";

    let isLogin = true;

    // ====================================
    // CHECK SAVED TOKEN
    // ====================================

    const savedToken = localStorage.getItem("token");

    if(savedToken){

        $("#authContainer").hide();

        $("#chatContainer").fadeIn(300);
    }

    // ====================================
    // TOGGLE LOGIN/SIGNUP
    // ====================================

    $("#toggleAuth").click(function(){

        isLogin = !isLogin;

        if(isLogin){

            $("#authTitle").text("Login");

            $("#authBtn").text("Login");

            $("#toggleAuth").text(
                "Don't have an account? Signup"
            );

        } else {

            $("#authTitle").text("Signup");

            $("#authBtn").text("Signup");

            $("#toggleAuth").text(
                "Already have an account? Login"
            );
        }
    });

    // ====================================
    // AUTHENTICATION
    // ====================================

    $("#authBtn").click(async function(){

        const username = $("#username").val().trim();

        const password = $("#password").val().trim();

        if(!username || !password){

            alert("Please fill all fields");

            return;
        }

        const endpoint = isLogin
            ? `${BASE_URL}/login`
            : `${BASE_URL}/signup`;

        try{

            const response = await fetch(endpoint,{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            });

            const data = await response.json();

            // ====================================
            // SIGNUP
            // ====================================

            if(!isLogin){

                alert(data.message || "Signup successful");

                isLogin = true;

                $("#authTitle").text("Login");

                $("#authBtn").text("Login");

                $("#toggleAuth").text(
                    "Don't have an account? Signup"
                );

                return;
            }

            // ====================================
            // LOGIN
            // ====================================

            if(data.access_token){

                localStorage.setItem(
                    "token",
                    data.access_token
                );

                $("#authContainer").hide();

                $("#chatContainer").fadeIn(300);

            } else {

                alert(data.message || "Login failed");
            }

        } catch(error){

            console.error(error);

            alert("Authentication failed");
        }
    });

    // ====================================
    // LOGOUT
    // ====================================

    $("#logoutBtn").click(function(){

        localStorage.removeItem("token");

        location.reload();
    });

    // ====================================
    // CHAT
    // ====================================

    $("#messageArea").on("submit", async function(event){

        event.preventDefault();

        const rawText = $("#text").val().trim();

        if(rawText === ""){
            return;
        }

        const date = new Date();

        const str_time =
            date.getHours() +
            ":" +
            String(date.getMinutes()).padStart(2, '0');

        // ====================================
        // USER MESSAGE
        // ====================================

        const userHtml =

            '<div class="d-flex justify-content-end mb-4">' +

                '<div class="msg_cotainer_send">' +

                    rawText +

                    '<span class="msg_time_send">' +

                        str_time +

                    '</span>' +

                '</div>' +

                '<div class="img_cont_msg">' +

                    '<img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="user_img_msg">' +

                '</div>' +

            '</div>';

        $("#text").val("");

        $("#messageFormeight").append(userHtml);

        $("#messageFormeight").scrollTop(
            $("#messageFormeight")[0].scrollHeight
        );

        // ====================================
        // TYPING INDICATOR
        // ====================================

        const typingHtml =

            '<div id="typing" class="d-flex justify-content-start mb-4">' +

                '<div class="img_cont_msg">' +

                    '<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="user_img_msg">' +

                '</div>' +

                '<div class="msg_cotainer typing_animation">' +

                    'Typing...' +

                '</div>' +

            '</div>';

        $("#messageFormeight").append(typingHtml);

        $("#messageFormeight").scrollTop(
            $("#messageFormeight")[0].scrollHeight
        );

        try{

            const token = localStorage.getItem("token");

            const response = await fetch(
                `${BASE_URL}/query`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json",
                        "Authorization": `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        question: rawText
                    })
                }
            );

            const data = await response.json();

            $("#typing").remove();

            // ====================================
            // BOT RESPONSE
            // ====================================

            const botHtml =

                '<div class="d-flex justify-content-start mb-4">' +

                    '<div class="img_cont_msg">' +

                        '<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="user_img_msg">' +

                    '</div>' +

                    '<div class="msg_cotainer">' +

                        (data.answer || "No response received.") +

                        '<span class="msg_time">' +

                            str_time +

                        '</span>' +

                    '</div>' +

                '</div>';

            $("#messageFormeight").append(botHtml);

            $("#messageFormeight").scrollTop(
                $("#messageFormeight")[0].scrollHeight
            );

        } catch(error){

            $("#typing").remove();

            console.error(error);

            const errorHtml =

                '<div class="d-flex justify-content-start mb-4">' +

                    '<div class="msg_cotainer">' +

                        'Server Error or Backend Not Running.' +

                    '</div>' +

                '</div>';

            $("#messageFormeight").append(errorHtml);
        }
    });

</script>

</body>
</html>
